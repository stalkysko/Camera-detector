<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>Part Orientation Detector V3</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#stage{position:fixed;inset:0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{background:#000}canvas{pointer-events:none}.bar{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:linear-gradient(#000e,#0000);display:flex;gap:6px;align-items:center;z-index:4;flex-wrap:wrap}.bar button,.bar select{font-size:14px;border:0;border-radius:10px;padding:10px 11px;min-height:42px}.bar button{font-weight:700}.status{font-size:12px;opacity:.95;flex:1;min-width:130px}.panel{position:fixed;z-index:5;top:calc(112px + env(safe-area-inset-top));right:8px;width:min(360px,calc(100% - 16px));max-height:68%;overflow:auto;background:#111e;border:1px solid #ffffff22;border-radius:14px;padding:12px;backdrop-filter:blur(10px);display:none}.panel.open{display:block}.panel h3{margin:0 0 8px;font-size:16px}.row{display:grid;grid-template-columns:1fr 72px;gap:8px;align-items:center;margin:8px 0}.row label{font-size:12px}.row input[type=range]{grid-column:1/3;width:100%}.val{text-align:right;font:12px ui-monospace,monospace}.checks{display:grid;gap:7px;margin-top:10px;font-size:12px}.checks label{display:flex;gap:8px;align-items:center}.panel .actions{display:flex;gap:7px;margin-top:10px}.panel button{border:0;border-radius:9px;padding:9px 10px;font-weight:650}.bottom{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;background:#000b;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35;backdrop-filter:blur(8px)}
</style></head><body><div id="stage"><video id="v" playsinline muted></video><canvas id="o"></canvas></div><div class="bar"><button id="start">Spustit kameru</button><button id="shot">Uložit snímek</button><button id="tune">Ladění</button><select id="cam"><option value="environment">Zadní kamera</option><option value="user">Přední kamera</option></select><span class="status" id="status">Načítám OpenCV…</span></div>
<div class="panel" id="panel"><h3>V3 • Ladění detekce</h3>
<div class="row"><label>Min. velikost dílu (% kratší strany)</label><span class="val" id="vMinPart"></span><input id="minPart" type="range" min="8" max="55" step="1"></div>
<div class="row"><label>Max. velikost dílu (%)</label><span class="val" id="vMaxPart"></span><input id="maxPart" type="range" min="20" max="95" step="1"></div>
<div class="row"><label>Citlivost obvodu dílu</label><span class="val" id="vOuter"></span><input id="outerSens" type="range" min="10" max="70" step="1"></div>
<div class="row"><label>Tolerance geometrie 4 děr</label><span class="val" id="vGeom"></span><input id="geomTol" type="range" min="5" max="35" step="1"></div>
<div class="row"><label>Tolerance / min. oblouk mezikruží</label><span class="val" id="vRing"></span><input id="ringArc" type="range" min="1" max="30" step="1"></div>
<div class="row"><label>Citlivost hrany mezikruží</label><span class="val" id="vRingEdge"></span><input id="ringEdge" type="range" min="8" max="60" step="1"></div>
<div class="row"><label>Framů pro LOCK</label><span class="val" id="vLock"></span><input id="lockFrames" type="range" min="2" max="15" step="1"></div>
<div class="row"><label>Tolerance úhlu pro LOCK</label><span class="val" id="vAngle"></span><input id="angleTol" type="range" min="1" max="15" step="1"></div>
<div class="checks"><label><input id="dbgParts" type="checkbox"> kandidáti celého dílu</label><label><input id="dbgHoles" type="checkbox"> nalezené otvory</label><label><input id="dbgRings" type="checkbox"> kandidáti mezikruží</label></div><div class="actions"><button id="defaults">Výchozí</button><button id="closePanel">Zavřít</button></div></div>
<div class="bottom">V3 • nejdřív ověří celý díl pomocí 4 otvorů, teprve potom hledá i krátký oblouk atypického mezikruží. TRACKING → LOCKED stabilizuje výsledek.</div><script async src="https://docs.opencv.org/4.x/opencv.js"></script><script>
const $=id=>document.getElementById(id),v=$('v'),out=$('o'),ctx=out.getContext('2d'),statusEl=$('status');let stream=null,running=false,cvReady=false,busy=false,last=0,tracks=[];
const defaults={minPart:16,maxPart:80,outerSens:34,geomTol:20,ringArc:4,ringEdge:22,lockFrames:6,angleTol:5,dbgParts:false,dbgHoles:true,dbgRings:true};
const ids=['minPart','maxPart','outerSens','geomTol','ringArc','ringEdge','lockFrames','angleTol','dbgParts','dbgHoles','dbgRings'];
function loadCfg(){let c={...defaults};try{c={...c,...JSON.parse(localStorage.getItem('detectorV3')||'{}')}}catch{};for(const id of ids){const e=$(id);if(e.type==='checkbox')e.checked=!!c[id];else e.value=c[id]}updateLabels()}
function cfg(){let c={};for(const id of ids){const e=$(id);c[id]=e.type==='checkbox'?e.checked:+e.value}return c}function saveCfg(){localStorage.setItem('detectorV3',JSON.stringify(cfg()));updateLabels()}
function updateLabels(){const c=cfg();$('vMinPart').textContent=c.minPart+'%';$('vMaxPart').textContent=c.maxPart+'%';$('vOuter').textContent=c.outerSens;$('vGeom').textContent='±'+c.geomTol+'%';$('vRing').textContent=c.ringArc+'%';$('vRingEdge').textContent=c.ringEdge;$('vLock').textContent=c.lockFrames;$('vAngle').textContent='±'+c.angleTol+'°'}loadCfg();ids.forEach(id=>$(id).addEventListener('input',saveCfg));$('defaults').onclick=()=>{localStorage.removeItem('detectorV3');loadCfg()};$('tune').onclick=()=>$('panel').classList.toggle('open');$('closePanel').onclick=()=>$('panel').classList.remove('open');
function waitCV(){if(window.cv&&cv.Mat){cvReady=true;statusEl.textContent='OpenCV připraveno'}else setTimeout(waitCV,250)}waitCV();
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:$('cam').value},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});v.srcObject=stream;await v.play();running=true;tracks=[];statusEl.textContent=`Kamera ${v.videoWidth}×${v.videoHeight}`;requestAnimationFrame(loop)}catch(e){statusEl.textContent='Kamera: '+e.message}}$('start').onclick=startCamera;$('cam').onchange=()=>{if(running)startCamera()};
$('shot').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const q=c.getContext('2d');q.drawImage(v,0,0);q.drawImage(out,0,0);c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`detector-v3-${Date.now()}.jpg`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200)},'image/jpeg',.95)};
function resize(){if(out.width!==v.videoWidth||out.height!==v.videoHeight){out.width=v.videoWidth;out.height=v.videoHeight}}
function loop(t){if(!running)return;requestAnimationFrame(loop);resize();if(!cvReady||busy||!v.videoWidth||t-last<180)return;last=t;busy=true;try{detect()}catch(e){statusEl.textContent='Detekce: '+e.message}busy=false}
function detect(){const C=cfg(),W=v.videoWidth,H=v.videoHeight,target=760,s=Math.min(1,target/Math.min(W,H)),pw=Math.round(W*s),ph=Math.round(H*s),mn=Math.min(pw,ph);const tmp=document.createElement('canvas');tmp.width=pw;tmp.height=ph;tmp.getContext('2d').drawImage(v,0,0,pw,ph);let src=cv.imread(tmp),gray=new cv.Mat(),blur=new cv.Mat(),circles=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(7,7),1.5,1.5,cv.BORDER_DEFAULT);
const minR=Math.round(mn*C.minPart/200),maxR=Math.round(mn*C.maxPart/200),p2=18+C.outerSens*.55;cv.HoughCircles(blur,circles,cv.HOUGH_GRADIENT,1.25,Math.max(45,minR*.9),115,p2,minR,maxR);let raw=[];for(let i=0;i<circles.cols;i++)raw.push({x:circles.data32F[i*3],y:circles.data32F[i*3+1],r:circles.data32F[i*3+2]});raw.sort((a,b)=>b.r-a.r);let parts=[];
for(const d of raw){if(parts.some(a=>Math.hypot(a.x-d.x,a.y-d.y)<Math.min(a.r,d.r)*.5))continue;const holes=findHoles(gray,d,C);const geo=validateFourHoleGeometry(d,holes,C.geomTol/100);if(!geo.ok)continue;d.holes=geo.holes;d.center=geo.center;d.ring=pickPartialRing(gray,d,geo.holes,C);d.angle=d.ring?angleDeg(d.center,d.ring):null;parts.push(d)}
updateTracks(parts,C);draw(parts,raw,C,s,W,H);statusEl.textContent=`${W}×${H} • díly ${parts.length} • LOCK ${tracks.filter(t=>t.locked).length}`;src.delete();gray.delete();blur.delete();circles.delete()}
function findHoles(gray,d,C){const pad=Math.round(d.r*.82),x0=Math.max(0,Math.round(d.x-pad)),y0=Math.max(0,Math.round(d.y-pad)),w=Math.min(gray.cols-x0,pad*2),h=Math.min(gray.rows-y0,pad*2);if(w<40||h<40)return[];let roi=gray.roi(new cv.Rect(x0,y0,w,h)),b=new cv.Mat(),cc=new cv.Mat();cv.GaussianBlur(roi,b,new cv.Size(5,5),1.1,1.1);cv.HoughCircles(b,cc,cv.HOUGH_GRADIENT,1.1,Math.max(10,d.r*.15),85,15,Math.max(5,d.r*.06),Math.max(11,d.r*.19));let a=[];for(let i=0;i<cc.cols;i++){let x=cc.data32F[i*3]+x0,y=cc.data32F[i*3+1]+y0,r=cc.data32F[i*3+2],dist=Math.hypot(x-d.x,y-d.y);if(dist>d.r*.30&&dist<d.r*.68&&!a.some(z=>Math.hypot(z.x-x,z.y-y)<d.r*.10))a.push({x,y,r,dist})}roi.delete();b.delete();cc.delete();return a}
function validateFourHoleGeometry(d,holes,tol){if(holes.length<4)return{ok:false};let best=null;for(let a=0;a<holes.length-3;a++)for(let b=a+1;b<holes.length-2;b++)for(let c=b+1;c<holes.length-1;c++)for(let e=c+1;e<holes.length;e++){let q=[holes[a],holes[b],holes[c],holes[e]],cx=q.reduce((s,h)=>s+h.x,0)/4,cy=q.reduce((s,h)=>s+h.y,0)/4,rs=q.map(h=>Math.hypot(h.x-cx,h.y-cy)),mean=rs.reduce((s,x)=>s+x,0)/4,spread=(Math.max(...rs)-Math.min(...rs))/mean;if(spread>tol)continue;let ang=q.map(h=>Math.atan2(h.y-cy,h.x-cx)).sort((x,y)=>x-y),g=[];for(let i=0;i<4;i++){let z=(ang[(i+1)%4]-ang[i]+Math.PI*2)%(Math.PI*2);g.push(z)}let gapErr=Math.max(...g.map(z=>Math.abs(z-Math.PI/2)/(Math.PI/2)));if(gapErr>tol*1.45)continue;let centerErr=Math.hypot(cx-d.x,cy-d.y)/d.r;if(centerErr>Math.max(.10,tol*.8))continue;let score=spread+gapErr+centerErr;if(!best||score<best.score)best={ok:true,holes:q,center:{x:cx,y:cy},score}}return best||{ok:false}}
function sampleGrad(gray,x,y){x=Math.round(x);y=Math.round(y);if(x<2||y<2||x>=gray.cols-2||y>=gray.rows-2)return 0;const gx=gray.ucharPtr(y,x+1)[0]-gray.ucharPtr(y,x-1)[0],gy=gray.ucharPtr(y+1,x)[0]-gray.ucharPtr(y-1,x)[0];return Math.hypot(gx,gy)}
function pickPartialRing(gray,d,holes,C){let best=null;for(const h of holes){let local=null;const base=Math.max(h.r,d.r*.065);for(let mul=1.20;mul<=2.05;mul+=.07){const rr=base*mul,N=144,hit=[],vals=[];for(let k=0;k<N;k++){const a=k*Math.PI*2/N,g=sampleGrad(gray,h.x+Math.cos(a)*rr,h.y+Math.sin(a)*rr);vals.push(g);hit.push(g>=C.ringEdge)}let longest=0,cur=0;for(let k=0;k<N*2;k++){if(hit[k%N]){cur++;longest=Math.max(longest,cur)}else cur=0}longest=Math.min(N,longest);const coverage=longest/N;const strength=vals.reduce((z,x,i)=>z+(hit[i]?x:0),0)/Math.max(1,hit.filter(Boolean).length);if(coverage>=C.ringArc/100&&(!local||coverage*strength>local.coverage*local.strength))local={x:h.x,y:h.y,r:rr,coverage,strength}}if(local&&(!best||local.coverage*local.strength>best.coverage*best.strength))best=local}return best}
function angleDeg(c,p){let a=Math.atan2(p.x-c.x,-(p.y-c.y))*180/Math.PI;return a<0?a+360:a}function angleDiff(a,b){let d=Math.abs(a-b)%360;return Math.min(d,360-d)}
function updateTracks(parts,C){const used=new Set;for(const t of tracks){let bi=-1,bd=1e9;for(let i=0;i<parts.length;i++){if(used.has(i))continue;let d=Math.hypot(parts[i].center.x-t.x,parts[i].center.y-t.y);if(d<bd){bd=d;bi=i}}if(bi>=0&&bd<Math.max(20,t.r*.22)){let p=parts[bi];used.add(bi);t.x=t.x*.72+p.center.x*.28;t.y=t.y*.72+p.center.y*.28;t.r=t.r*.75+p.r*.25;t.miss=0;if(p.angle!=null){if(t.angle==null||angleDiff(t.angle,p.angle)<=C.angleTol){t.stable++;let rad1=t.angle==null?p.angle*Math.PI/180:t.angle*Math.PI/180,rad2=p.angle*Math.PI/180,x=Math.cos(rad1)*.7+Math.cos(rad2)*.3,y=Math.sin(rad1)*.7+Math.sin(rad2)*.3;t.angle=(Math.atan2(y,x)*180/Math.PI+360)%360}else{t.stable=1;t.angle=p.angle;t.locked=false}if(t.stable>=C.lockFrames)t.locked=true}p.track=t}else t.miss++}tracks=tracks.filter(t=>t.miss<8);for(let i=0;i<parts.length;i++)if(!used.has(i)){let p=parts[i],t={x:p.center.x,y:p.center.y,r:p.r,angle:p.angle,stable:p.angle!=null?1:0,locked:false,miss:0};tracks.push(t);p.track=t}}
function draw(parts,raw,C,s,W,H){ctx.clearRect(0,0,W,H);ctx.lineWidth=Math.max(2,W/650);ctx.font=`${Math.max(17,W/58)}px -apple-system`;if(C.dbgParts){ctx.strokeStyle='#ffb84d88';for(const d of raw){ctx.beginPath();ctx.arc(d.x/s,d.y/s,d.r/s,0,Math.PI*2);ctx.stroke()}}
for(const d of parts){const cx=d.center.x/s,cy=d.center.y/s,R=d.r/s,t=d.track,locked=t&&t.locked;ctx.strokeStyle=locked?'#38f58a':'#ffe05b';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=locked?Math.max(4,W/420):Math.max(2,W/650);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.fillRect(cx-4,cy-4,8,8);if(C.dbgHoles){ctx.lineWidth=2;for(const h of d.holes){ctx.beginPath();ctx.arc(h.x/s,h.y/s,h.r/s,0,Math.PI*2);ctx.stroke()}}if(d.ring&&C.dbgRings){ctx.strokeStyle='#59c7ff';ctx.beginPath();ctx.arc(d.ring.x/s,d.ring.y/s,d.ring.r/s,0,Math.PI*2);ctx.stroke()}if(t&&t.angle!=null){const rad=t.angle*Math.PI/180,L=R*.65,ax=cx+Math.sin(rad)*L,ay=cy-Math.cos(rad)*L;ctx.strokeStyle=locked?'#38f58a':'#ffe05b';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ax,ay);ctx.stroke();let label=locked?`LOCKED ${t.angle.toFixed(1)}°`:`TRACKING ${Math.min(t.stable,C.lockFrames)}/${C.lockFrames} • ${t.angle.toFixed(1)}°`;ctx.fillStyle=ctx.strokeStyle;ctx.fillText(label,Math.max(8,cx-R*.85),Math.max(28,cy-R-10));ctx.fillText(`X${Math.round(cx)} Y${Math.round(cy)}`,Math.max(8,cx-R*.85),Math.max(50,cy-R+15))}else{ctx.fillText('?°',Math.max(8,cx-R*.85),Math.max(28,cy-R-10))}}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
