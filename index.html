<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><title>Part Orientation Detector</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#stage{position:fixed;inset:0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{background:#000}canvas{pointer-events:none}.bar{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#000c,#0000);display:flex;gap:8px;align-items:center;z-index:3}.bar button,.bar select{font-size:15px;border:0;border-radius:10px;padding:10px 12px}.bar button{font-weight:700}.status{font-size:12px;opacity:.9;flex:1}.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;background:#000a;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.35;backdrop-filter:blur(8px)}
</style></head><body><div id="stage"><video id="v" playsinline muted></video><canvas id="o"></canvas></div><div class="bar"><button id="start">Spustit kameru</button><select id="cam"><option value="environment">Zadní kamera</option><option value="user">Přední kamera</option></select><span class="status" id="status">Připraveno</span></div><div class="bottom">V1: kruhový díl → 4 otvory → atypické mezikruží → X/Y + úhel. 0° nahoře, 90° vpravo.</div>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
const v=document.getElementById('v'), out=document.getElementById('o'), ctx=out.getContext('2d'), statusEl=document.getElementById('status');
let stream=null, running=false, cvReady=false, busy=false, last=0;
function waitCV(){if(window.cv&&cv.Mat){cvReady=true;statusEl.textContent='OpenCV připraveno';}else setTimeout(waitCV,250)} waitCV();
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop()); const facing=document.getElementById('cam').value;stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});v.srcObject=stream;await v.play();running=true;statusEl.textContent=`Kamera ${v.videoWidth}×${v.videoHeight}`;requestAnimationFrame(loop)}catch(e){statusEl.textContent='Kamera: '+e.message;}}
document.getElementById('start').onclick=startCamera;document.getElementById('cam').onchange=()=>{if(running)startCamera()};
function resize(){if(out.width!==v.videoWidth||out.height!==v.videoHeight){out.width=v.videoWidth;out.height=v.videoHeight}}
function loop(t){if(!running)return;requestAnimationFrame(loop);resize();if(!cvReady||busy||!v.videoWidth||t-last<180)return;last=t;busy=true;try{detect()}catch(e){statusEl.textContent='Detekce: '+e.message}busy=false}
function detect(){
 // Capture full-HD source; process a 0.5x copy for speed, retain full-res coordinates for overlay.
 const W=v.videoWidth,H=v.videoHeight,s=.5,pw=Math.round(W*s),ph=Math.round(H*s);
 const tmp=document.createElement('canvas');tmp.width=pw;tmp.height=ph;tmp.getContext('2d').drawImage(v,0,0,pw,ph);
 let src=cv.imread(tmp), gray=new cv.Mat(), blur=new cv.Mat(), circles=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(7,7),1.5,1.5,cv.BORDER_DEFAULT);
 // Candidate outer discs. Parameters are intentionally broad and exposed here for field tuning.
 const minR=Math.max(22,Math.round(Math.min(pw,ph)*.025)), maxR=Math.round(Math.min(pw,ph)*.13);
 cv.HoughCircles(blur,circles,cv.HOUGH_GRADIENT,1.25,minR*1.5,120,36,minR,maxR);
 ctx.clearRect(0,0,W,H);let accepted=0;
 for(let i=0;i<circles.cols;i++){
   const x=circles.data32F[i*3],y=circles.data32F[i*3+1],r=circles.data32F[i*3+2];
   const holes=findHoles(gray,x,y,r); if(!holes||holes.length<4)continue;
   const ring=pickRing(gray,x,y,r,holes); if(!ring)continue;
   accepted++; const X=x/s,Y=y/s,R=r/s,AX=ring.x/s,AY=ring.y/s;
   let deg=Math.atan2(AX-X, -(AY-Y))*180/Math.PI;if(deg<0)deg+=360;
   ctx.lineWidth=Math.max(2,W/700);ctx.strokeStyle='#33ff88';ctx.fillStyle='#33ff88';ctx.font=`${Math.max(18,W/55)}px -apple-system`;
   ctx.beginPath();ctx.arc(X,Y,R,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(AX,AY,ring.r/s,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(AX,AY);ctx.stroke();ctx.fillRect(X-3,Y-3,6,6);ctx.fillText(`${Math.round(deg)}°  X${Math.round(X)} Y${Math.round(Y)}`,X+R*.65,Y-R*.65);
 }
 statusEl.textContent=`${W}×${H} • nalezeno ${accepted}`;
 src.delete();gray.delete();blur.delete();circles.delete();
}
function findHoles(gray,cx,cy,R){
 const pad=Math.round(R*.82),x0=Math.max(0,Math.round(cx-pad)),y0=Math.max(0,Math.round(cy-pad)),w=Math.min(gray.cols-x0,pad*2),h=Math.min(gray.rows-y0,pad*2);if(w<20||h<20)return null;
 let roi=gray.roi(new cv.Rect(x0,y0,w,h)), b=new cv.Mat(), c=new cv.Mat();cv.GaussianBlur(roi,b,new cv.Size(5,5),1,1);cv.HoughCircles(b,c,cv.HOUGH_GRADIENT,1.1,Math.max(8,R*.18),90,18,Math.max(3,R*.055),Math.max(8,R*.19));
 let a=[];for(let i=0;i<c.cols;i++){let x=c.data32F[i*3]+x0,y=c.data32F[i*3+1]+y0,r=c.data32F[i*3+2],d=Math.hypot(x-cx,y-cy);if(d>R*.28&&d<R*.68)a.push({x,y,r,d})}roi.delete();b.delete();c.delete();return a;
}
function pickRing(gray,cx,cy,R,holes){
 // Score annular edge energy around each candidate hole. Counterbore has a second strong concentric edge.
 let best=null,bestScore=0;for(const h of holes){let inner=0,outer=0,n1=0,n2=0;for(let k=0;k<72;k++){let a=k*Math.PI/36;for(let rr=h.r*.72;rr<h.r*1.05;rr+=1){let x=Math.round(h.x+Math.cos(a)*rr),y=Math.round(h.y+Math.sin(a)*rr);if(x>1&&y>1&&x<gray.cols-1&&y<gray.rows-1){inner+=Math.abs(gray.ucharPtr(y,x+1)[0]-gray.ucharPtr(y,x-1)[0]);n1++}}for(let rr=h.r*1.25;rr<h.r*2.15;rr+=1){let x=Math.round(h.x+Math.cos(a)*rr),y=Math.round(h.y+Math.sin(a)*rr);if(x>1&&y>1&&x<gray.cols-1&&y<gray.rows-1){outer+=Math.abs(gray.ucharPtr(y,x+1)[0]-gray.ucharPtr(y,x-1)[0]);n2++}}}let score=(outer/Math.max(1,n2))/(inner/Math.max(1,n1)+1);if(score>bestScore){bestScore=score;best=h}}
 return bestScore>0.48?best:null;
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
