<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070a"><title>Part Detector V8</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#stage{position:fixed;inset:0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{background:#000}canvas{pointer-events:none}.bar{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:linear-gradient(#000e,#0000);display:flex;gap:6px;align-items:center;z-index:4;flex-wrap:wrap}.bar button{font-size:14px;border:0;border-radius:10px;padding:10px 12px;min-height:42px;font-weight:750}.status{font-size:12px;min-width:150px;flex:1}.bottom{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;background:#000c;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.35;backdrop-filter:blur(8px)}#snap{display:none;position:fixed;inset:0;z-index:20;background:#000e;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));overflow:auto}#snap img{width:100%;max-width:760px;display:block;margin:auto;border-radius:12px}#snap .actions{max-width:760px;margin:10px auto;display:flex;gap:8px;flex-wrap:wrap}#snap button{font-size:16px;padding:12px;border:0;border-radius:10px;font-weight:700}
</style></head><body><div id="stage"><video id="v" playsinline muted></video><canvas id="o"></canvas></div><div class="bar"><button id="start">Spustit kameru</button><button id="freeze">❄️ Zmrazit</button><button id="shot">📸 Snímek</button><button id="torch" disabled>💡 Světlo</button><span class="status" id="status">Načítám OpenCV…</span></div><div class="bottom" id="info"><b>V8 • DÍL → 4 DÍRY → 1 JINÁ</b><br>Výstup: obrys kotouče + výrazné označení atypické díry. Bez úhlu a bez LOCKu.</div><div id="snap"><img id="snapImg"><div class="actions"><button id="share">Sdílet / Uložit do Fotek</button><button id="close">Zavřít</button></div></div><script async src="https://docs.opencv.org/4.x/opencv.js"></script><script>
const $=x=>document.getElementById(x),v=$('v'),o=$('o'),ctx=o.getContext('2d');let stream=null,ready=false,busy=false,last=0,frozen=false,fc=document.createElement('canvas'),torch=false,lastFile=null,lastUrl=null;
function wait(){if(window.cv&&cv.Mat){ready=true;$('status').textContent='OpenCV připraveno'}else setTimeout(wait,250)}wait();
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});v.srcObject=stream;await v.play();setupTorch();requestAnimationFrame(loop)}catch(e){$('status').textContent='Kamera: '+e.message}}
function setupTorch(){let tr=stream&&stream.getVideoTracks()[0],cap=tr&&tr.getCapabilities?tr.getCapabilities():{};$('torch').disabled=!cap.torch;$('torch').textContent=cap.torch?'💡 Světlo OFF':'💡 Světlo N/A'}
$('torch').onclick=async()=>{let tr=stream&&stream.getVideoTracks()[0];try{torch=!torch;await tr.applyConstraints({advanced:[{torch}]});$('torch').textContent='💡 Světlo '+(torch?'ON':'OFF')}catch{$('torch').disabled=true;$('torch').textContent='💡 Světlo N/A'}};$('start').onclick=start;
$('freeze').onclick=()=>{if(!v.videoWidth)return;if(!frozen){fc.width=v.videoWidth;fc.height=v.videoHeight;fc.getContext('2d').drawImage(v,0,0);frozen=true;$('freeze').textContent='▶️ Pokračovat'}else{frozen=false;$('freeze').textContent='❄️ Zmrazit'}};
$('shot').onclick=async()=>{if(!v.videoWidth)return;let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;let q=c.getContext('2d');q.drawImage(frozen?fc:v,0,0);q.drawImage(o,0,0);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));if(lastUrl)URL.revokeObjectURL(lastUrl);lastFile=new File([b],`part-detector-v8-${Date.now()}.jpg`,{type:'image/jpeg'});lastUrl=URL.createObjectURL(b);$('snapImg').src=lastUrl;$('snap').style.display='block'};$('close').onclick=()=>$('snap').style.display='none';$('share').onclick=async()=>{if(navigator.canShare&&navigator.canShare({files:[lastFile]}))await navigator.share({files:[lastFile],title:'Part Detector V8'})};
function loop(t){requestAnimationFrame(loop);if(!ready||busy||!v.videoWidth||t-last<220)return;last=t;busy=true;try{detect()}catch(e){$('status').textContent='Detekce: '+e.message}busy=false}
function med(a){a=a.slice().sort((x,y)=>x-y);return a[Math.floor(a.length/2)]}function mean(a){return a.reduce((s,x)=>s+x,0)/Math.max(1,a.length)}
function dedup(cs,f=.35){let out=[];for(const c of cs){let q=out.find(x=>Math.hypot(x.x-c.x,x.y-c.y)<Math.min(x.r,c.r)*f);if(!q)out.push(c)}return out}
function radialEdge(gray,h,r0,r1){let vals=[];const N=72;for(let k=0;k<N;k++){let a=2*Math.PI*k/N,prev=null,mx=0;for(let r=r0;r<=r1;r+=2){let x=Math.round(h.x+Math.cos(a)*r),y=Math.round(h.y+Math.sin(a)*r);if(x<1||y<1||x>=gray.cols-1||y>=gray.rows-1)continue;let z=gray.ucharPtr(y,x)[0];if(prev!==null)mx=Math.max(mx,Math.abs(z-prev));prev=z}vals.push(mx)}return mean(vals)}
function chooseFour(holes,cx,cy,R){let hs=holes.filter(h=>{let d=Math.hypot(h.x-cx,h.y-cy);return d>R*.20&&d<R*.72&&h.r>R*.045&&h.r<R*.24});if(hs.length<4)return null;hs=hs.sort((a,b)=>Math.abs(Math.hypot(a.x-cx,a.y-cy)-R*.43)-Math.abs(Math.hypot(b.x-cx,b.y-cy)-R*.43)).slice(0,12);let best=null;for(let a=0;a<hs.length-3;a++)for(let b=a+1;b<hs.length-2;b++)for(let c=b+1;c<hs.length-1;c++)for(let d=c+1;d<hs.length;d++){let q=[hs[a],hs[b],hs[c],hs[d]],rs=q.map(h=>Math.hypot(h.x-cx,h.y-cy)),rm=mean(rs),spread=(Math.max(...rs)-Math.min(...rs))/rm;if(spread>.30)continue;let rr=q.map(h=>h.r),rspread=(Math.max(...rr)-Math.min(...rr))/med(rr);if(rspread>.55)continue;let ang=q.map(h=>Math.atan2(h.y-cy,h.x-cx)).sort((x,y)=>x-y),g=[];for(let i=0;i<4;i++){let z=(ang[(i+1)%4]-ang[i]+Math.PI*2)%(Math.PI*2);g.push(z)}let angleErr=mean(g.map(x=>Math.abs(x-Math.PI/2)))/(Math.PI/2);let score=spread+angleErr*.9+rspread*.25;if(!best||score<best.score)best={holes:q,score}}return best&&best.score<.52?best:null}
function detect(){let W=v.videoWidth,H=v.videoHeight;if(o.width!==W||o.height!==H){o.width=W;o.height=H}let scale=Math.min(1,820/Math.min(W,H)),pw=Math.round(W*scale),ph=Math.round(H*scale),tmp=document.createElement('canvas');tmp.width=pw;tmp.height=ph;tmp.getContext('2d').drawImage(frozen?fc:v,0,0,pw,ph);let src=cv.imread(tmp),gray=new cv.Mat(),blur=new cv.Mat(),outer=new cv.Mat(),holesM=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.medianBlur(gray,blur,5);
// 1) velké kotouče – Hough pracuje na hranách/jasových přechodech, ne na jednom prahu barvy
cv.HoughCircles(blur,outer,cv.HOUGH_GRADIENT,1.2,Math.min(pw,ph)*.18,110,42,Math.round(Math.min(pw,ph)*.10),Math.round(Math.min(pw,ph)*.48));
// 2) všechny možné menší kruhové hrany; finálně je přijme až geometrie 4 otvorů uvnitř konkrétního kotouče
cv.HoughCircles(blur,holesM,cv.HOUGH_GRADIENT,1.15,Math.min(pw,ph)*.025,105,24,Math.round(Math.min(pw,ph)*.012),Math.round(Math.min(pw,ph)*.11));
let disks=[],holes=[];for(let i=0;i<outer.cols;i++)disks.push({x:outer.data32F[i*3],y:outer.data32F[i*3+1],r:outer.data32F[i*3+2]});for(let i=0;i<holesM.cols;i++)holes.push({x:holesM.data32F[i*3],y:holesM.data32F[i*3+1],r:holesM.data32F[i*3+2]});disks=dedup(disks,.45).slice(0,12);holes=dedup(holes,.45).slice(0,80);
let found=[];for(const disk of disks){let q=chooseFour(holes,disk.x,disk.y,disk.r);if(!q)continue;let mx=mean(q.holes.map(h=>h.x)),my=mean(q.holes.map(h=>h.y));if(Math.hypot(mx-disk.x,my-disk.y)>disk.r*.15)continue;
 // atypičnost: hledáme přídavnou silnou hranu ZA běžným okrajem díry. Každá díra se hodnotí relativně vůči ostatním 3.
 let scores=q.holes.map(h=>{let base=radialEdge(gray,h,h.r*.80,h.r*1.20),outerE=radialEdge(gray,h,h.r*1.28,h.r*2.15);return outerE/(base*.35+8)}),ord=[0,1,2,3].sort((a,b)=>scores[b]-scores[a]),best=ord[0],second=ord[1],ratio=scores[best]/Math.max(.01,scores[second]);found.push({disk,holes:q.holes,best,ratio,scores,conf:Math.min(99,Math.round(45+(ratio-1)*100))})}
 // sloučení duplicit stejného kotouče
 found.sort((a,b)=>b.ratio-a.ratio);let clean=[];for(const f of found)if(!clean.some(g=>Math.hypot(g.disk.x-f.disk.x,g.disk.y-f.disk.y)<Math.min(g.disk.r,f.disk.r)*.35))clean.push(f);draw(clean,scale,W,H);$('status').textContent=`${W}×${H} • díly ${clean.length}`;$('info').innerHTML=clean.length?`<b>V8 • nalezeno ${clean.length} dílů</b><br>${clean.map((f,i)=>`Díl ${i+1}: atypická ${f.ratio>=1.10?'✓':'?'} • jistota ${f.ratio>=1.10?f.conf:'nízká'}${typeof f.conf==='number'&&f.ratio>=1.10?' %':''}`).join(' &nbsp; | &nbsp; ')}`:'<b>V8 • hledám kotouč + 4 otvory</b><br>Nic nehádám, dokud neprojde geometrie celého dílu.';src.delete();gray.delete();blur.delete();outer.delete();holesM.delete()}
function draw(fs,s,W,H){ctx.clearRect(0,0,W,H);let id=1;for(const f of fs){let D=f.disk,cx=D.x/s,cy=D.y/s,R=D.r/s,ok=f.ratio>=1.10;ctx.strokeStyle=ok?'#31f58b':'#ffd84d';ctx.lineWidth=Math.max(4,W/280);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){let h=f.holes[i],x=h.x/s,y=h.y/s,r=h.r/s;ctx.strokeStyle=i===f.best?(ok?'#ff3b6b':'#ffd84d'):'#ffffffaa';ctx.lineWidth=i===f.best?Math.max(7,W/190):Math.max(2,W/500);ctx.beginPath();ctx.arc(x,y,i===f.best?r*1.7:r*1.12,0,Math.PI*2);ctx.stroke();if(i===f.best){ctx.fillStyle=ctx.strokeStyle;ctx.font=`800 ${Math.max(20,W/48)}px -apple-system`;ctx.fillText(ok?'← ATYPICKÁ':'? NEJISTÉ',Math.min(W-170,x+r*1.8),Math.max(30,y-10))}}ctx.fillStyle='#000c';let label=`DÍL ${id++}  ${ok?'✓':'?'}`;ctx.font=`800 ${Math.max(18,W/52)}px -apple-system`;let tw=ctx.measureText(label).width+20,bx=Math.max(8,Math.min(W-tw-8,cx-R)),by=Math.max(8,cy-R-42);ctx.fillRect(bx,by,tw,36);ctx.fillStyle=ok?'#31f58b':'#ffd84d';ctx.fillText(label,bx+10,by+25)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=8').catch(()=>{});
</script></body></html>
