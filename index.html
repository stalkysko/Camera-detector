<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>Part Orientation Detector V2</title><link rel="manifest" href="manifest.webmanifest"><style>
html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#stage{position:fixed;inset:0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{background:#000}canvas{pointer-events:none}.bar{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:linear-gradient(#000d,#0000);display:flex;gap:7px;align-items:center;z-index:3;flex-wrap:wrap}.bar button,.bar select{font-size:14px;border:0;border-radius:10px;padding:10px 11px}.bar button{font-weight:700}.status{font-size:12px;opacity:.95;flex:1;min-width:120px}.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;background:#000b;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.35;backdrop-filter:blur(8px)}
</style></head><body><div id="stage"><video id="v" playsinline muted></video><canvas id="o"></canvas></div><div class="bar"><button id="start">Spustit kameru</button><button id="shot">Uložit snímek</button><select id="cam"><option value="environment">Zadní kamera</option><option value="user">Přední kamera</option></select><span class="status" id="status">Načítám OpenCV…</span></div><div class="bottom">V2 • X/Y středu dílu + úhel atypické díry. 0° nahoře, 90° vpravo. Atypický otvor se hodnotí i z krátkého oblouku mezikruží.</div><script async src="https://docs.opencv.org/4.x/opencv.js"></script><script>
const v=document.getElementById('v'),out=document.getElementById('o'),ctx=out.getContext('2d'),statusEl=document.getElementById('status');let stream=null,running=false,cvReady=false,busy=false,last=0;
function waitCV(){if(window.cv&&cv.Mat){cvReady=true;statusEl.textContent='OpenCV připraveno';}else setTimeout(waitCV,250)}waitCV();
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:document.getElementById('cam').value},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});v.srcObject=stream;await v.play();running=true;statusEl.textContent=`Kamera ${v.videoWidth}×${v.videoHeight}`;requestAnimationFrame(loop)}catch(e){statusEl.textContent='Kamera: '+e.message}}
document.getElementById('start').onclick=startCamera;document.getElementById('cam').onchange=()=>{if(running)startCamera()};
document.getElementById('shot').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const q=c.getContext('2d');q.drawImage(v,0,0);q.drawImage(out,0,0);c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`detector-${new Date().toISOString().replace(/[:.]/g,'-')}.jpg`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},'image/jpeg',.94)};
function resize(){if(out.width!==v.videoWidth||out.height!==v.videoHeight){out.width=v.videoWidth;out.height=v.videoHeight}}
function loop(t){if(!running)return;requestAnimationFrame(loop);resize();if(!cvReady||busy||!v.videoWidth||t-last<220)return;last=t;busy=true;try{detect()}catch(e){statusEl.textContent='Detekce: '+e.message}busy=false}
function detect(){const W=v.videoWidth,H=v.videoHeight;const target=720,s=Math.min(1,target/Math.min(W,H)),pw=Math.round(W*s),ph=Math.round(H*s);const tmp=document.createElement('canvas');tmp.width=pw;tmp.height=ph;tmp.getContext('2d').drawImage(v,0,0,pw,ph);let src=cv.imread(tmp),gray=new cv.Mat(),blur=new cv.Mat(),circles=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(9,9),1.8,1.8,cv.BORDER_DEFAULT);
// V2: V1 měla max. poloměr jen 13 % kratší strany. Zde 4–47 %, takže funguje detail jednoho kusu i více kusů v přepravce.
const mn=Math.min(pw,ph),minR=Math.max(24,Math.round(mn*.04)),maxR=Math.round(mn*.47);cv.HoughCircles(blur,circles,cv.HOUGH_GRADIENT,1.3,Math.max(30,minR*1.25),110,30,minR,maxR);ctx.clearRect(0,0,W,H);let candidates=[];
for(let i=0;i<circles.cols;i++){const d={x:circles.data32F[i*3],y:circles.data32F[i*3+1],r:circles.data32F[i*3+2]};const holes=findHoles(gray,d.x,d.y,d.r);if(holes.length<3)continue;d.holes=holes;d.ring=pickPartialRing(gray,d,holes);d.quality=Math.min(1,holes.length/4)*(d.ring?d.ring.confidence:.35);if(!candidates.some(a=>Math.hypot(a.x-d.x,a.y-d.y)<Math.min(a.r,d.r)*.45))candidates.push(d)}
for(const d of candidates){const X=d.x/s,Y=d.y/s,R=d.r/s;ctx.lineWidth=Math.max(2,W/700);ctx.strokeStyle=d.ring?'#36f58a':'#ffd34d';ctx.fillStyle=ctx.strokeStyle;ctx.font=`${Math.max(18,W/55)}px -apple-system`;ctx.beginPath();ctx.arc(X,Y,R,0,Math.PI*2);ctx.stroke();ctx.fillRect(X-4,Y-4,8,8);let label=`X${Math.round(X)} Y${Math.round(Y)}`;if(d.ring){const AX=d.ring.x/s,AY=d.ring.y/s;let deg=Math.atan2(AX-X,-(AY-Y))*180/Math.PI;if(deg<0)deg+=360;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(AX,AY);ctx.stroke();ctx.beginPath();ctx.arc(AX,AY,Math.max(9,d.ring.r/s),0,Math.PI*2);ctx.stroke();label=`${deg.toFixed(1)}°  ${label}  arc ${Math.round(d.ring.coverage*100)}%`}else label=`?°  ${label}`;ctx.fillText(label,Math.max(8,X-R*.9),Math.max(28,Y-R-12))}
statusEl.textContent=`${W}×${H} • díly ${candidates.length} • úhel ${candidates.filter(x=>x.ring).length}`;src.delete();gray.delete();blur.delete();circles.delete()}
function findHoles(gray,cx,cy,R){const pad=Math.round(R*.78),x0=Math.max(0,Math.round(cx-pad)),y0=Math.max(0,Math.round(cy-pad)),w=Math.min(gray.cols-x0,pad*2),h=Math.min(gray.rows-y0,pad*2);if(w<30||h<30)return[];let roi=gray.roi(new cv.Rect(x0,y0,w,h)),b=new cv.Mat(),c=new cv.Mat();cv.GaussianBlur(roi,b,new cv.Size(5,5),1.1,1.1);cv.HoughCircles(b,c,cv.HOUGH_GRADIENT,1.1,Math.max(8,R*.16),80,14,Math.max(4,R*.055),Math.max(10,R*.22));let a=[];for(let i=0;i<c.cols;i++){let x=c.data32F[i*3]+x0,y=c.data32F[i*3+1]+y0,r=c.data32F[i*3+2],d=Math.hypot(x-cx,y-cy);if(d>R*.28&&d<R*.72&&!a.some(z=>Math.hypot(z.x-x,z.y-y)<R*.09))a.push({x,y,r,d})}roi.delete();b.delete();c.delete();return a}
function sampleGrad(gray,x,y){x=Math.round(x);y=Math.round(y);if(x<2||y<2||x>=gray.cols-2||y>=gray.rows-2)return 0;const gx=gray.ucharPtr(y,x+1)[0]-gray.ucharPtr(y,x-1)[0],gy=gray.ucharPtr(y+1,x)[0]-gray.ucharPtr(y-1,x)[0];return Math.hypot(gx,gy)}
function pickPartialRing(gray,disc,holes){let best=null;for(const h of holes){let bestRadius=null,bestCov=0,bestStrength=0;const base=Math.max(h.r,disc.r*.07);for(let mul=1.22;mul<=2.05;mul+=.08){const rr=base*mul;let vals=[];for(let k=0;k<120;k++){const a=k*Math.PI*2/120;vals.push(sampleGrad(gray,h.x+Math.cos(a)*rr,h.y+Math.sin(a)*rr))}const sorted=[...vals].sort((a,b)=>a-b),thr=Math.max(20,sorted[Math.floor(sorted.length*.72)]);let hit=vals.map(v=>v>=thr&&v>=22); // arc continuity, not full ring
let longest=0,cur=0;for(let k=0;k<hit.length*2;k++){if(hit[k%hit.length]){cur++;longest=Math.max(longest,cur)}else cur=0}longest=Math.min(longest,hit.length);const cov=longest/hit.length,str=vals.reduce((s,v,i)=>s+(hit[i]?v:0),0)/Math.max(1,hit.filter(Boolean).length);if(cov>bestCov||(Math.abs(cov-bestCov)<.01&&str>bestStrength)){bestCov=cov;bestStrength=str;bestRadius=rr}}
// Už 4 % souvislého obvodu (~14°) může být důkaz; skóre navíc zvýhodňuje delší/silnější oblouk.
const conf=Math.min(1,bestCov/.18)*Math.min(1,bestStrength/55);if(bestCov>=.04&&(!best||conf>best.confidence)){best={x:h.x,y:h.y,r:bestRadius,coverage:bestCov,confidence:conf}}}return best&&best.confidence>=.18?best:null}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
